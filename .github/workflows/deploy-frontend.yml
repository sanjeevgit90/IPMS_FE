name: Deploy IPMS Frontend

on:
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: self-hosted

    steps:

      # =========================================
      # 1. Checkout source code
      # =========================================

      - name: Checkout Frontend
        uses: actions/checkout@v5

      # =========================================
      # 2. Check Node.js and NPM
      # =========================================

      - name: Check Node Version
        shell: powershell
        run: |
          Write-Host "Node Version:"
          node --version

          Write-Host "NPM Version:"
          npm --version

      # =========================================
      # 3. Install dependencies
      # =========================================

      - name: Install Dependencies
        shell: powershell
        run: |
          npm ci --legacy-peer-deps

      # =========================================
      # 4. Build Angular application
      # =========================================

      - name: Build Angular Application
        shell: powershell
        run: |
          npm run build

      # =========================================
      # 5. Verify Angular build
      # =========================================

      - name: Verify Build
        shell: powershell
        run: |

          Write-Host "Angular build completed."

          if (!(Test-Path ".\dist")) {
            Write-Error "Angular dist folder was not created."
            exit 1
          }

          $source = Join-Path $env:GITHUB_WORKSPACE "dist\ipms_fe\browser"

          if (!(Test-Path $source)) {
            Write-Error "Angular browser build was not found:"
            Write-Error $source
            exit 1
          }

          if (!(Test-Path "$source\index.html")) {
            Write-Error "index.html was not found in Angular browser build."
            exit 1
          }

          Write-Host ""
          Write-Host "Angular browser build verified."

          Write-Host ""
          Write-Host "Build structure:"
          Get-ChildItem -Path $source -Recurse |
            Select-Object FullName

      # =========================================
      # 6. Deploy Angular application to IIS
      # =========================================

      - name: Deploy to IIS
        shell: powershell
        run: |

          # =========================================
          # Configuration
          # =========================================

          $source = Join-Path $env:GITHUB_WORKSPACE "dist\ipms_fe\browser"
          $target = "C:\inetpub\wwwroot\ipms"
          $backupRoot = "C:\inetpub\wwwroot\ipms-backups"

          Write-Host "======================================"
          Write-Host "IPMS FRONTEND DEPLOYMENT"
          Write-Host "======================================"

          Write-Host "Source:"
          Write-Host $source

          Write-Host ""
          Write-Host "Target:"
          Write-Host $target

          # =========================================
          # Verify Angular build
          # =========================================

          if (!(Test-Path $source)) {

            Write-Error "Angular browser build not found:"
            Write-Error $source

            exit 1
          }

          if (!(Test-Path "$source\index.html")) {

            Write-Error "index.html not found in Angular browser build."

            exit 1
          }

          Write-Host ""
          Write-Host "Angular browser build verified."

          # =========================================
          # Verify IIS target folder
          # =========================================

          if (!(Test-Path $target)) {

            Write-Error "IIS deployment folder does not exist:"
            Write-Error $target

            exit 1
          }

          # =========================================
          # Create backup root directory
          # =========================================

          if (!(Test-Path $backupRoot)) {

            New-Item `
              -ItemType Directory `
              -Path $backupRoot `
              -Force | Out-Null

            Write-Host ""
            Write-Host "Backup root directory created:"
            Write-Host $backupRoot
          }

          # =========================================
          # Create timestamped backup directory
          # =========================================

          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"

          $backupPath = Join-Path $backupRoot $timestamp

          New-Item `
            -ItemType Directory `
            -Path $backupPath `
            -Force | Out-Null

          Write-Host ""
          Write-Host "Backup directory:"
          Write-Host $backupPath

          # =========================================
          # Backup current application
          #
          # Do NOT backup uploadFile because
          # it contains runtime/user uploaded files.
          # =========================================

          Write-Host ""
          Write-Host "Creating application backup..."

          Get-ChildItem $target -Force |
            Where-Object {
              $_.Name -ne "uploadFile" -and
              $_.Name -ne "web.config"
            } |
            Copy-Item `
              -Destination $backupPath `
              -Recurse `
              -Force

          # =========================================
          # Backup web.config separately
          # =========================================

          if (Test-Path "$target\web.config") {

            Copy-Item `
              "$target\web.config" `
              "$backupPath\web.config" `
              -Force

            Write-Host "web.config backed up."
          }

          Write-Host "Application backup completed."

          # =========================================
          # Remove old Angular application files
          #
          # PRESERVE:
          #   web.config
          #   uploadFile
          # =========================================

          Write-Host ""
          Write-Host "Removing old Angular application files..."

          Get-ChildItem $target -Force |
            Where-Object {
              $_.Name -ne "uploadFile" -and
              $_.Name -ne "web.config"
            } |
            Remove-Item `
              -Recurse `
              -Force

          Write-Host "Old Angular application files removed."

          # =========================================
          # Copy new Angular browser build
          # =========================================

          Write-Host ""
          Write-Host "Copying new Angular application..."

          Copy-Item `
            "$source\*" `
            $target `
            -Recurse `
            -Force

          Write-Host "New Angular application copied."

          # =========================================
          # Verify web.config
          # =========================================

          if (!(Test-Path "$target\web.config")) {

            Write-Error "Deployment failed: web.config is missing."

            exit 1
          }

          Write-Host "web.config preserved successfully."

          # =========================================
          # Verify uploadFile
          # =========================================

          if (!(Test-Path "$target\uploadFile")) {

            Write-Error "Deployment failed: uploadFile folder is missing."

            exit 1
          }

          Write-Host "uploadFile folder preserved successfully."

          # =========================================
          # Verify Angular application
          # =========================================

          if (!(Test-Path "$target\index.html")) {

            Write-Error "Deployment failed: index.html not found."

            exit 1
          }

          Write-Host "index.html found successfully."

          # =========================================
          # Backup Retention
          #
          # Keep latest 5 backups
          # =========================================

          Write-Host ""
          Write-Host "======================================"
          Write-Host "BACKUP RETENTION"
          Write-Host "======================================"

          $keepBackups = 5

          $backups = Get-ChildItem $backupRoot -Directory |
            Sort-Object LastWriteTime -Descending

          Write-Host "Total backups found: $($backups.Count)"
          Write-Host "Backups to keep: $keepBackups"

          if ($backups.Count -gt $keepBackups) {

            $backupsToDelete = $backups |
              Select-Object -Skip $keepBackups

            foreach ($oldBackup in $backupsToDelete) {

              Write-Host ""
              Write-Host "Deleting old backup:"
              Write-Host $oldBackup.FullName

              Remove-Item `
                $oldBackup.FullName `
                -Recurse `
                -Force
            }

            Write-Host ""
            Write-Host "Old backups removed successfully."
          }
          else {

            Write-Host ""
            Write-Host "No old backups need to be removed."
          }

          # =========================================
          # Display remaining backups
          # =========================================

          Write-Host ""
          Write-Host "Remaining backups:"

          Get-ChildItem $backupRoot -Directory |
            Sort-Object LastWriteTime -Descending |
            Select-Object Name, LastWriteTime

          # =========================================
          # Final deployment message
          # =========================================

          Write-Host ""
          Write-Host "======================================"
          Write-Host "FRONTEND DEPLOYMENT SUCCESSFUL"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "Deployment Path:"
          Write-Host $target

          Write-Host ""
          Write-Host "Backup Path:"
          Write-Host $backupPath

          Write-Host ""
          Write-Host "Preserved:"
          Write-Host "  - web.config"
          Write-Host "  - uploadFile"

          Write-Host ""
          Write-Host "Backup Retention:"
          Write-Host "  - Latest 5 backups retained"

          Write-Host ""
          Write-Host "======================================"