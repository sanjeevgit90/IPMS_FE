@if (showLoading) {
  <app-loader></app-loader>
}
<form [formGroup]="forgotpasswordForm" class="login-container" (ngSubmit)="forgotpassword()">
  <!-- Main Wrapper -->
  <div class="main-wrapper">
    <div class="account-content">

      <div class="container">

        <!-- Logo -->
        <div class="account-logo">
          <a href="Dashboard"><img src="assets/Images/letterhead/AurionPro-logo1-black.png" alt="HR Managemet"></a>
        </div>
        <!-- /Logo -->

        <div class="account-box">
          <div class="account-wrapper">

            <p class="account-title">Forgot Password</p>


            @if (errorHandle) {
              <div class="help-block">{{errorMessage}}</div>
            }
            <div class="form-group">
              <mat-icon matPrefix>person</mat-icon><label>User Name</label>
              <div [ngClass]="{ 'has-error': isSubmitted && formControls.username.errors }">
                <input type="text" class="form-control" name="name" placeholder="Please enter username"
                  [(ngModel)]="forgotPasswordData.username" formControlName="username">
                </div>

                @if (isSubmitted && formControls.username.errors) {
                  <div class="help-block">
                    @if (formControls.username.errors.required) {
                      <div>Username is required</div>
                    }
                  </div>
                }
              </div>
              <div class="form-group text-center">
                <button class="account-btn" type="submit">Submit</button>
                  <!-- <mat-icon aria-hidden="false">save</mat-icon> -->
                  <button class="w-100 mt-4" style="background: #686868; height: 56px;" mat-flat-button color="primary" (click)="back()">
                    <mat-icon aria-hidden="false">close</mat-icon>
                  Back</button>
                </div>
              </div>
            </div>
            <div style="clear:both"></div>
          </div>
        </div>
      </div>
      <!-- /Main Wrapper -->
    </form>
