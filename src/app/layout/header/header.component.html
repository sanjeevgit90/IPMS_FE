<!-- Header -->
<div class="header aurion-header">

  <!-- Brand -->
  <div class="aurion-header-brand">
    <img src="assets/Images/letterhead/AurionPro-logo1.png" alt="Aurionpro" title="Aurionpro">
  </div>
  <!-- /Brand -->

  <!-- District selector (Team Lead only) -->
  @if (roleTL) {
    <div class="tl-district">
      <div class="form-group">
        <mat-form-field>
          <mat-select [(ngModel)]="district" [ngModelOptions]="{standalone: true}"
            (selectionChange)="selectDistrict(district)">
            @for (districtdata of tldistict; track districtdata) {
              <mat-option value="{{districtdata.id.geographyname}}">  
                {{districtdata.id.geographyname}}
              </mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
    </div>
  }

  <!-- Right side -->
  <ul class="nav user-menu aurion-header-actions">

    <!-- Home shortcut (change the route if your dashboard path is different) -->
    <li class="nav-item">
      <a class="aurion-icon-btn" routerLink="/dashboard" title="Dashboard">
        <i class="material-icons">home</i>
      </a>
    </li>

    <!-- User -->
    <li class="nav-item dropdown main-drop">
      <a href="#" class="dropdown-toggle nav-link aurion-user" data-toggle="dropdown" aria-expanded="false">
        <span class="user-name">{{username}}</span>
        <span class="user-img">
          <img src="assets/Images/duumy.jpg" alt="">
          <span class="status online"></span>
        </span>
        <i class="material-icons aurion-user-caret">expand_more</i>
      </a>
      <div class="dropdown-menu dropdown-menu-right">
        <a class="dropdown-item" routerLink="/profile">My Profile</a>
        <a class="dropdown-item" routerLink="/changepassword">Change Password</a>
        <a class="dropdown-item" (click)="logout()">Logout</a>
      </div>
    </li>
  </ul>
  <!-- /Right side -->

  <!-- Mobile Menu -->
  <div class="dropdown mobile-user-menu">
    <a href="#" class="nav-link dropdown-toggle" data-toggle="dropdown" aria-expanded="false">
      <i class="glyphicon glyphicon-option-vertical"></i>
    </a>
    <div class="dropdown-menu dropdown-menu-right">
      <a class="dropdown-item" routerLink="/profile">My Profile</a>
      <a class="dropdown-item" routerLink="/changepassword">Change Password</a>
      <a class="dropdown-item" (click)="logout()">Logout</a>
    </div>
  </div>
  <!-- /Mobile Menu -->

</div>
<!-- /Header -->
